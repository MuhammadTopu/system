services:
  app:
    image: topu409/system-app:latest
    container_name: system-app
    ports:
      - "8787:8787"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    container_name: system-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - system_pg:/var/lib/postgresql/data

volumes:
  system_pg: